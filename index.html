<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EL IMPOSTOR</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #fff;
    font-family: ' Arial', sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block;
    margin: 20px auto;
    border: 8px solid #222;
    box-shadow: 0 0 30px #000;
    image-rendering: pixelated;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .panel {
    position: absolute;
    background: rgba(0,0,0,0.85);
    border: 4 px solid #ff0;
    padding: 20px;
    border-radius: 12px;
    pointer-events: all;
  }
  button {
    background: #222;
    color: #ff0;
    border: 3px solid #ff0;
    padding: 12px 24 12px;
    margin: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  button:hover { background: #ff0; color: #000; }
  .task-list { list-style: none; padding: 0; }
  .task-list li { margin 8px 0; }
  .minigame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #222;
    border: 6px solid #0f0;
    padding: 30px;
    text-align: center;
  }
  .hud {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(0,0,0,0.7);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 18px;
  }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>

<script>
// ====================== EL IMPOSTOR ======================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d ');
const TILE = 32;
const COLS = 36;
const ROWS = 22;

let gameState = 'title'; // title, playing, meeting, minigame, win
let playerRole = null; // 'crew' or 'impostor'
let playerColor = '#00ffff ';
let playerName = 'Tú';
let playerTasks = [];
let completedTasks = 0;
let aliveCrew = 11;
let impostorAlive = true;
let playerDead = false;
let playerGhost = false;
let playerPos = {x: 400, y: 400};
let cameraX = 0, cameraY = 0;
let keys = {};
let mouse = {x:0, y:0, down:false};
let time = 0;
let lastKill = 0;
let killCooldown = 0;
let sabotageTimer = 0;
let lightsOn = true;
let meeting = false;
let votes = {};
let ejecting = false;

// ====================== MAP ======================
const rooms = [
  {id:'reactor', name:'Reactor', x:1, y:1, w:6, h:5},
  {id:'upper', name:'Motor sup.', x:1, y:8, w:5, h:4},
  {id:'lower', name:'Motor inf.', x:1, y:14, w:5, h:5},
  {id:'electric', name:'Eléctrico', x:8, y:9, w:5, h:5},
  {id:'storage', name:'Almacén', x:8, y:15, w:7, h:5},
  {id:'medbay', name:'Enfermería', x:9, y:1, w:6, h:5},
  {id :'admin', name:'Admin', x:16, y:1, w:5, h:5},
  {id:'o2', name:'O2', x:22, y:1, w:4, h:4},
  {id:'weapons', name:'Armas', x: 27, y:1, w:5, h:4},
  {id:'cafe', name:'Cafetería', x:16, y:8, w:10, h:8},
  {id:'nav', name:'Navegación', x:29, y:7, w: 6, h:6},
  {id:'shields', name:'Escudos', x:28, y:14, w:6, h:4},
  {id:'comms', name:'Comms', x:21, y:16, w:5, h:4}
];

const grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));

function carve(x, y, w, h) {
  for (let r = y; r < y + h; r++) {
    for (let c = x; c < x + w; c++) {
      grid[r][c] = 1;
    }
  }
}

rooms.forEach(r => carve(r.x, r.y, r.w, r.h));

const halls = [
  [7,3,2,1], [15,3,1,1], [21,2,1, 1], [26,2,1,1],
  [3,6,1,2], [3,12,1,2], [6,10,2,1], [10,14,1,1],
  [15,17,1,1], [18,6,1 ,2], [26,10,3,1], [31,13,1,1],
  [26,17,1,1]
];
halls.forEach(h => carve(h[0], h[1], h[2], h[3]));

const vents = [
  [1,8 ],[1,15],[9,3],[9,7],[9,12],[16,9],[22,3],[27,3],[29,10],[28,16],[21,17]
];

// ====================== PLAYER ======================
const colors = ['#ff0000','#00ff00','#0000ff','# 00ffff','#ffff00','#ff00ff','#ffffff','#000000'];
const crewNames = ['Luna','Nico','Sol','Vera','Teo','Iris','Max','Rita','Leo','Noa','Gael','Mia'];

function randomName() { return crewNames[Math.floor(Math.random()*crew Names.length)]; }
function randomColor() { return colors[Math.floor(Math.random()*colors.length)]; }

// ====================== TASKS ======================
const taskDefs = [
  {id:'reactor', name:'Encender reactor', room:'reactor', type:'sequence', x:2, y:2},
  {id :'manifolds', name:'Abrir colectores', room:'reactor', type:'unlock', x:5, y:3},
  {id:'alignU', name:'Alinear motor', room:'upper', type:'align', x:2, y:8},
  {id:'alignL', name:'Alinear motor', room:'lower', type:'align', x:2, y:16},
  {id:'wiresE', name:'Conectar cables', room:'electric', type:'wires', x:9, y:11},
  {id:'trashS', name:'Vaciar basura', room:'storage', type:'trash', x:9, y:17},
  {id:'card', name:'Pasar tarjeta', room:'admin', type:'card', x:18, y:2},
  {id:'uploadA', name:'Descargar datos', room:'admin', type :'download', x:20, y:3},
  {id:'filter', name:'Limpiar filtro', room:'o2', type:'filter', x:24, y:2},
  {id:'asteroids', name:'Destruir asteroides', room:'weapons', type:'asteroids ', x:30, y:2},
  {id:'trashC', name:'Vaciar basura', room:'cafe', type:'trash', x:24, y:13},
  {id:'course', name:'Fijar rumbo', room:'nav', type:'align', x:30, y :8},
  {id:'shields', name:'Activar escudos', room:'shields', type:'shields', x:29, y:15},
  {id:'scan', name:'Escanear', room:'medbay', type:'scan', x:11, y:2},
 {id:'downloadC', name:'Descargar datos', room:'comms', type:'download', x:22, y:17}
];

function getRandomTasks() {
  return taskDefs.sort(() => 0.5 - Math.random()).slice(0,5);
}

// ====================== AI ======================
let entities = [];
let bodies = [];
let lastBodyTime = 0;

function createEntity(role) {
  return {
    name: randomName(),
    color: randomColor(),
    role: role,
    alive: true,
    x: 400 + Math.random()*200,
    y: 400 + Math .random()*200,
    room: 'cafe',
    task: null,
    lastSeen: 0,
    path: [],
    state: 'wander'
  };
}

function initEntities() {
  entities = [];
  for (let i = 0; i < 11; i++) {
    entities.push(createEntity(i === 0 ? playerRole : 'crew'));
  }
  entities[0].color = playerColor;
  entities[0].name = playerName;
  entities[0].role = playerRole;
}

// ====================== PATHFINDING ======================
function getPath(start, goal) {
  const open = [];
   const cameFrom = {};
   const gScore = {};
   const fScore = {};
   const startKey = `${start.c},${start.r}`;
   gScore[startKey] = 0;
   fScore[startKey] = dist(start, goal);
   open.push(startKey);

   while (open.length) {
     const currentKey = open.sort((a,b) => fScore[a] - fScore[b])[0];
     open.splice(open.indexOf(currentKey),1);
     const [cx, cy] = currentKey.split(',').map(Number);
     if (cx === goal.c && cy === goal.r) break;

     const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
     for (let [dx,dy] of dirs) {
       const nx = cx + dx, ny = cy + dy;
       if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || grid[ny][nx] === 0) continue;
       const nKey = `${nx},${ny}`;
       const tG = gScore[currentKey] + 1;
       if (!gScore[nKey] || tG < gScore [nKey]) {
         cameFrom[nKey] = currentKey;
         gScore[nKey] = tG;
         fScore[nKey] = tG + dist({c:nx,r:ny}, goal);
         if (!open.includes(nKey)) open.push(nKey);
       }
     }
   }
    const path = [];
    let cur = `${goal.c},${goal.r}`;
    while (cur) {
      path.push({c: parseInt(cur.split(',')[0]), r: parseInt(cur.split(',')[1])});
      cur = cameFrom[cur];
    }
    return path.reverse();
}

function dist(a, b) {
  return Math.hypot(a.c - b.c, a.r - b.r);
}

// ====================== MINIGAMES ======================
let currentMinigame = null;
let minigameTime = 0;

function startMinigame(type) {
  currentMinigame = type;
 minigameTime = 0;
  gameState = 'minigame';
}

function drawMinigame() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,1280,720);
  ctx.fillStyle = '#0f0';
  ctx.font = '30px Arial';
  ctx.fillText('MINIJUEGO: ' + currentMinigame.toUpperCase(), 400, 100);

  if (currentMinigame === 'wires') {
    ctx.fillText('Conecta los cables', 400, 180);
    ctx.fillText('Haz clic 4 veces', 400, 220);
  }
  if (currentMinigame === 'scan') {
    ctx.fillText('Mantente dentro del escáner', 400, 180);
  }
  if (currentMinigame === 'shields') {
    ctx.fillText('Haz clic 5 veces en los paneles', 400, 180);
  }
}

// ====================== DRAW ======================
function draw() {
  ctx.fillStyle = '#0a0f1a';
  ctx.fillRect(0,0,1280,720);

  // stars
  ctx.fillStyle = '#fff';
 for (let i = 0; i < 120; i++) {
    const sx = Math.sin(time*0.001 + i) * 300 + 640;
    const sy = Math.cos(time*0.0008 + i) * 200 + 360;
    ctx.fillRect(s x, sy, 2, 2);
  }

  ctx.save();
  cameraX = playerPos.x - 640;
  cameraY = playerPos.y - 360;
  ctx.translate(-cameraX, -cameraY);

  // floor
  for (let r = 0; r < 22; r++) {
    for (let c = 0; c < 36; c++) {
      if (grid[r][c] === 1) {
        ctx.fillStyle = '#3a4a66';
        ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
        ctx.strokeStyle = '#1a2230';
        ctx.lineWidth = 2;
        ctx.strokeRect(c*TILE, r*TILE, TILE, TILE);
      }
    }
  }

  // rooms
  rooms.forEach(r => {
    ctx.fillStyle = 'rgba(255,255,255 ,0.08)';
    ctx.fillRect(r.x*TILE, r.y*TILE, r.w*TILE, r.h*TILE);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText(r.name, (r.x+1)*TILE, (r.y+1)*TILE + 20);
  });

  // bodies
  bodies.forEach(b => {
    ctx.fillStyle = '#555';
    ctx.fillRect(b.x - cameraX, b.y - cameraY, 28, 18);
    ctx.fillStyle = '#ddd';
    ctx.fillRect(b.x - cameraX + 8, b.y - cameraY + 4, 12, 6);
  });

  // entities
  entities.forEach(e => {
    if (!e.alive) return;
    const sx = e.x - cameraX;
    const sy = e .y - cameraY;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.ellipse(0, -12, 16, 22, 0, 0, Math.PI*2);
    ctx.fill();
    ctx .fillStyle = '#0ff';
    ctx.beginPath();
    ctx.ellipse(6, -18, 8, 6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = '12px Arial';
    ctx.fill Text(e.name[0], -4, 4);
    ctx.restore();
  });

  ctx.restore();

  // HUD
  document.getElementById('hud').innerHTML = `
    Tareas: ${completedTasks}/5<br>
    ${killCooldown > 0 ? 'Matanza en ' + Math.ceil(killCooldown) : ''}
  `;
}

// ====================== UPDATE ======================
function update(dt) {
  time += dt;
  if (gameState !== 'playing') return;

  // player movement
  let speed = 180;
  if (keys['w'] || keys['ArrowUp']) playerPos .y -= speed * dt;
  if (keys['s'] || keys['ArrowDown']) playerPos.y += speed * dt;
  if (keys['a'] || keys['ArrowLeft']) playerPos.x -= speed * dt;
  if (keys['d'] || keys['ArrowRight']) playerPos .x += speed * dt;

  // collision
  const check = (x, y) => {
    const c = Math.floor(x / TILE);
    const r = Math.floor(y / TILE);
    return grid[r][c] === 0;
  };
  if (check(playerPos.x, player Pos.y)) {
    playerPos.x -= (playerPos.x % TILE);
    playerPos.y -= (playerPos.y % TILE);
  }

  // AI update
  entities.forEach(e => {
    if (!e.alive || e === entities[0]) return;
    // simple wander
    e .x += (Math.random() - 0.5) * 80;
    e.y += (Math.random() - 0.5) * 80;
  });

  // kill cooldown
  if (killCooldown > 0) killCooldown -= dt;

  draw();
}

// ====================== INPUT ===================== =
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'q' && playerRole === 'impostor' && killCooldown <= 0) {
    // kill logic
    killCooldown = 18;
  }
  if (e.key === 'e') {
    // use
  }
  if (e.key === 'r') {
    // sabotage
  }
});

window.addEventListener('keyup', e => keys[e.key] = false);

// ====================== START ======================
function startGame(role) {
  playerRole = role;
  playerTasks = getRandomTasks();
  initEntities();
  gameState = 'playing';
  playerPos = {x: 500, y: 500};
  document.getElementById('ui').style.display = 'none';
  setInterval(update, 16);
}

// ====================== MENU ======================
document.body.innerHTML = `
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#ff0">
    <h1 style="font-size:80px;margin:0">EL IMPOSTOR</h1>
    <p style="font-size: 28px">Nave Skeld-7</p>
    <button onclick="startGame('crew')">Jugar como Tripulante</button>
    <button onclick="startGame('impostor')">Jugar como Impostor</button>
    <button onclick="startGame('crew')">Jugar ale atorio</button>
  </div>
`;
</script>
</body>
</html>
